<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <title>Transport Company Simulator</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Logix Transport">

  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="garage.css">
  <link rel="stylesheet" href="trucks.css">
  <link rel="stylesheet" href="drivers.css">
  <link rel="stylesheet" href="orders.css">
  <link rel="stylesheet" href="trips.css">
  <link rel="stylesheet" href="finance.css">
  <link rel="stylesheet" href="contracts.css">
  <link rel="stylesheet" href="market.css">
  <link rel="stylesheet" href="company.css">
  <link rel="stylesheet" href="analytics.css">
  <link rel="stylesheet" href="onboarding.css">
  <link rel="stylesheet" href="debug.css">
</head>
<body>
  <div id="app" class="app-root">
    <!-- Desktop Sidebar Navigation -->
    <aside class="desktop-sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">TC</div>
        <div class="brand-text">
          <span class="company-name" id="sidebar-company-name">Logix Transport</span>
          <span class="company-level" id="sidebar-company-level">Ранг: Частный перевозчик</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <button class="nav-item active" data-tab="office_hub"><span>Главный офис</span></button>
        <button class="nav-item" data-tab="orders"><span>Биржа заказов</span></button>
        <button class="nav-item" data-tab="trips"><span>Рейсы & Карта GPS</span></button>
        <button class="nav-item" data-tab="garage_hub"><span>Гараж & Флот</span></button>
        <button class="nav-item" data-tab="market_hub"><span>Рынок & Закупки</span></button>
        <button class="nav-item" data-tab="company"><span>Компания & Сеть</span></button>
      </nav>

      <div class="sidebar-footer">
        <button class="icon-button" id="theme-toggle-btn">🌓</button>
        <button class="icon-button" onclick="AppDebug.openConsoleModal()">🛠️</button>
      </div>
    </aside>

    <!-- Main Viewport Area -->
    <div class="app-viewport">
      <header class="app-topbar glass-bar">
        <div class="topbar-section company-quick-info">
          <div class="status-indicator live"></div>
          <span class="game-time-display" id="time-display">08:00 (День 1)</span>
        </div>

        <div class="time-controls glass-subgroup">
          <button class="time-speed-btn active" data-speed="1">1x</button>
          <button class="time-speed-btn" data-speed="2">2x</button>
          <button class="time-speed-btn" data-speed="5">5x</button>
          <button class="time-speed-btn" data-speed="0">⏸</button>
        </div>

        <div class="topbar-section finance-quick-info">
          <div class="balance-tag">
            <span class="currency-symbol">€</span>
            <span class="balance-amount" id="topbar-balance">100 000</span>
          </div>
        </div>
      </header>

      <main class="app-content-stage" id="tab-stage">
        <section class="tab-view active" id="view-office_hub"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-orders"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-trips"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-garage_hub"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-market_hub"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-company"><div class="view-scroll-content"></div></section>
      </main>

      <div class="bottom-sheet-backdrop" id="app-sheet-backdrop">
        <div class="bottom-sheet-modal glass-sheet" id="app-bottom-sheet">
          <div class="sheet-drag-handle"></div>
          <div class="sheet-header">
            <h3 id="sheet-title">Сведения</h3>
            <button class="sheet-close-btn" id="sheet-close-btn">&times;</button>
          </div>
          <div class="sheet-content" id="sheet-content"></div>
        </div>
      </div>

      <!-- Мобильный таббар -->
      <nav class="mobile-tabbar glass-bar" id="mobile-tabbar">
        <button class="tabbar-item active" data-tab="office_hub">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 0h-4V4h4v2z"/></svg>
          <span>Офис</span>
        </button>

        <button class="tabbar-item" data-tab="orders">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM12 3c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span>Заказы</span>
        </button>

        <button class="tabbar-item" data-tab="trips">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5z"/></svg>
          <span>Рейсы</span>
        </button>

        <button class="tabbar-item" data-tab="garage_hub">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.89-2-2-2zm0 14H5V8h14v10z"/></svg>
          <span>Гараж</span>
        </button>

        <button class="tabbar-item" data-tab="market_hub">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
          <span>Рынок</span>
        </button>

        <button class="tabbar-item" data-tab="company">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
          <span>Сеть</span>
        </button>
      </nav>
    </div>
  </div>

  <script src="data_trucks.js"></script>
  <script src="data_cargo.js"></script>
  <script src="data_cities.js"></script>
  <script src="data_events.js"></script>
  <script src="data_contracts.js"></script>
  <script src="data_companies.js"></script>
  <script src="data_achievements.js"></script>
  <script src="state.js"></script>
  <script src="storage.js"></script>
  <script src="time.js"></script>
  <script src="garage.js"></script>
  <script src="trucks.js"></script>
  <script src="dealership.js"></script>
  <script src="drivers.js"></script>
  <script src="orders.js"></script>
  <script src="trips.js"></script>
  <script src="finance.js"></script>
  <script src="contracts.js"></script>
  <script src="market.js"></script>
  <script src="market_hub.js"></script>
  <script src="office_hub.js"></script>
  <script src="competitors.js"></script>
  <script src="company.js"></script>
  <script src="analytics.js"></script>
  <script src="onboarding.js"></script>
  <script src="debug.js"></script>
  <script src="ui.js"></script>
  <script src="data_warehouses.js"></script>
  <script src="main.js"></script>
</body>
</html>
