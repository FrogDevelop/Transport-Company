<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <title>Transport Company Simulator</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Logix Transport">

  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="garage.css">
  <link rel="stylesheet" href="trucks.css">
  <link rel="stylesheet" href="drivers.css">
  <link rel="stylesheet" href="orders.css">
  <link rel="stylesheet" href="trips.css">
  <link rel="stylesheet" href="finance.css">
  <link rel="stylesheet" href="contracts.css">
  <link rel="stylesheet" href="market.css">
  <link rel="stylesheet" href="company.css">
  <link rel="stylesheet" href="analytics.css">
  <link rel="stylesheet" href="onboarding.css">
  <link rel="stylesheet" href="debug.css">
</head>
<body>
  <div id="app" class="app-root">
    <!-- Desktop Sidebar Navigation -->
    <aside class="desktop-sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">TC</div>
        <div class="brand-text">
          <span class="company-name" id="sidebar-company-name">Logix Transport</span>
          <span class="company-level" id="sidebar-company-level">Ранг: Частный перевозчик</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <button class="nav-item active" data-tab="dashboard"><span>Дашборд</span></button>
        <button class="nav-item" data-tab="orders"><span>Биржа заказов</span></button>
        <button class="nav-item" data-tab="trips"><span>Рейсы & Карта GPS</span></button>
        <button class="nav-item" data-tab="fleet"><span>Мой автопарк</span></button>
        <button class="nav-item" data-tab="dealership"><span>Автосалон техники</span></button>
        <button class="nav-item" data-tab="drivers"><span>Штат водителей</span></button>
        <button class="nav-item" data-tab="drivers_market"><span>Биржа найма</span></button>
        <button class="nav-item" data-tab="garage"><span>Гараж & База</span></button>
        <button class="nav-item" data-tab="finances"><span>Финансы & P&L</span></button>
        <button class="nav-item" data-tab="contracts"><span>B2B Контракты</span></button>
        <button class="nav-item" data-tab="market"><span>Рынок & Дизель</span></button>
        <button class="nav-item" data-tab="company"><span>Компания & Сеть</span></button>
        <button class="nav-item" data-tab="analytics"><span>Аналитика</span></button>
      </nav>

      <div class="sidebar-footer">
        <button class="icon-button" id="theme-toggle-btn">🌓</button>
        <button class="icon-button" onclick="AppDebug.openConsoleModal()">🛠️</button>
      </div>
    </aside>

    <!-- Main Viewport Area -->
    <div class="app-viewport">
      <header class="app-topbar glass-bar">
        <div class="topbar-section company-quick-info">
          <div class="status-indicator live"></div>
          <span class="game-time-display" id="time-display">08:00 (День 1)</span>
        </div>

        <div class="time-controls glass-subgroup">
          <button class="time-speed-btn active" data-speed="1">1x</button>
          <button class="time-speed-btn" data-speed="2">2x</button>
          <button class="time-speed-btn" data-speed="5">5x</button>
          <button class="time-speed-btn" data-speed="0">⏸</button>
        </div>

        <div class="topbar-section finance-quick-info">
          <div class="balance-tag">
            <span class="currency-symbol">€</span>
            <span class="balance-amount" id="topbar-balance">100 000</span>
          </div>
        </div>
      </header>

      <main class="app-content-stage" id="tab-stage">
        <section class="tab-view active" id="view-dashboard">
          <div class="view-scroll-content">
            <div class="stats-overview-grid">
              <div class="glass-card stat-card primary">
                <div class="card-label">Чистый баланс</div>
                <div class="card-val" id="stat-balance">€100 000</div>
                <div class="card-sub-val positive" id="stat-daily-net">+€0 / день</div>
              </div>
              <div class="glass-card stat-card">
                <div class="card-label">Выручка (Сегодня)</div>
                <div class="card-val" id="stat-revenue">€0</div>
                <div class="card-sub-val neutral">Расходы: <span id="stat-expenses">€0</span></div>
              </div>
              <div class="glass-card stat-card">
                <div class="card-label">Парк / Вместимость</div>
                <div class="card-val" id="stat-fleet-slots">1 / 3</div>
                <div class="card-sub-val" id="stat-utilization">Загрузка: 0%</div>
              </div>
              <div class="glass-card stat-card">
                <div class="card-label">Репутация</div>
                <div class="card-val highlight" id="stat-reputation">50 / 100</div>
                <div class="card-sub-val neutral">Класс C</div>
              </div>
            </div>

            <div class="dashboard-operational-grid">
              <div class="glass-card operational-panel">
                <div class="panel-header">
                  <h3>Активные рейсы</h3>
                  <span class="badge" id="badge-active-trips">0</span>
                </div>
                <div class="panel-body" id="dashboard-active-trips-list"></div>
              </div>

              <div class="glass-card operational-panel">
                <div class="panel-header">
                  <h3>Состояние техники</h3>
                  <span class="badge warning" id="badge-fleet-alerts">Внимание</span>
                </div>
                <div class="panel-body" id="dashboard-fleet-status-list"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="tab-view" id="view-orders"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-trips"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-fleet"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-dealership"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-drivers"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-drivers_market"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-garage"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-finances"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-contracts"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-market"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-company"><div class="view-scroll-content"></div></section>
        <section class="tab-view" id="view-analytics"><div class="view-scroll-content"></div></section>
      </main>

      <div class="bottom-sheet-backdrop" id="app-sheet-backdrop">
        <div class="bottom-sheet-modal glass-sheet" id="app-bottom-sheet">
          <div class="sheet-drag-handle"></div>
          <div class="sheet-header">
            <h3 id="sheet-title">Сведения</h3>
            <button class="sheet-close-btn" id="sheet-close-btn">&times;</button>
          </div>
          <div class="sheet-content" id="sheet-content"></div>
        </div>
      </div>

      <!-- Мобильный таббар -->
      <nav class="mobile-tabbar glass-bar">
        <button class="tabbar-item active" data-tab="dashboard">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span>Дашборд</span>
        </button>
        <button class="tabbar-item" data-tab="orders">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Заказы</span>
        </button>
        <button class="tabbar-item" data-tab="trips">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
          <span>Карта</span>
        </button>
        <button class="tabbar-item" data-tab="fleet">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M4 16c0 1.1.9 2 2 2h1v2a1 1 0 0 0 2 0v-2h6v2a1 1 0 0 0 2 0v-2h1c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v10z"/></svg>
          <span>Флот</span>
        </button>
        <button class="tabbar-item" id="mobile-more-menu-btn" data-tab="more">
          <svg class="tabbar-icon" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          <span>Ещё</span>
        </button>
      </nav>
    </div>
  </div>

  <script src="data_trucks.js"></script>
  <script src="data_cargo.js"></script>
  <script src="data_cities.js"></script>
  <script src="data_events.js"></script>
  <script src="data_contracts.js"></script>
  <script src="data_companies.js"></script>
  <script src="data_achievements.js"></script>
  <script src="state.js"></script>
  <script src="storage.js"></script>
  <script src="time.js"></script>
  <script src="garage.js"></script>
  <script src="trucks.js"></script>
  <script src="dealership.js"></script>
  <script src="drivers.js"></script>
  <script src="orders.js"></script>
  <script src="trips.js"></script>
  <script src="finance.js"></script>
  <script src="contracts.js"></script>
  <script src="market.js"></script>
  <script src="competitors.js"></script>
  <script src="company.js"></script>
  <script src="analytics.js"></script>
  <script src="onboarding.js"></script>
  <script src="debug.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
